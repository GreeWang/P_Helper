[project]
name = "p-helper"
version = "1.1.0"
description = "Generate evidence-backed paper summaries and answer questions with local keyword retrieval."
authors = [{name = "GreeWang"}]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
keywords = ["pdf", "markdown", "paper", "summarization", "rag", "question-answering"]
dependencies = [
    "fastapi>=0.115,<1",
    "marker-pdf>=2,<3",
    "python-multipart>=0.0.9,<1",
    "requests>=2.31.0,<3",
    "uvicorn>=0.30,<1",
    "Pillow>=10.1.0,<11",
    "python-dotenv>=1.0.0,<2",
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/GreeWang/P_Helper"

[project.scripts]
p-helper = "frame.main:main"

[tool.poetry]
packages = [{include = "frame"}]
include = ["frame/web_static/**"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
build = "^1.2.0"
httpx = "^0.28.0"

[tool.pytest.ini_options]
markers = [
    "marker: slow tests that require Marker models and fixture PDFs",
    "model: opt-in tests that call the configured external chat model",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
