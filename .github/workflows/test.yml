name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install --no-deps -e .
      - run: pip install pytest build requests "Pillow<11" python-dotenv "pydantic>=2,<3"
      - run: pytest -m "not marker"
      - run: python -m build
