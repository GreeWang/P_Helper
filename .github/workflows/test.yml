name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .
      - run: >
          python -m pip install
          "pytest>=8,<9" "build>=1.2,<2" "httpx>=0.28,<1"
          "fastapi>=0.115,<1" "python-multipart>=0.0.9,<1"
          "requests>=2.31,<3" "uvicorn>=0.30,<1"
          "Pillow>=10.1,<11" "python-dotenv>=1,<2" "pydantic>=2,<3"
      - run: python -m pytest -m "not marker and not model"
      - run: python -m build
